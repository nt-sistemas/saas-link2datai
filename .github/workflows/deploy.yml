name: Deploy on Contabo
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # or your desired PHP version
          extensions: mbstring, pdo_pgsql, zip, gd, dom, fileinfo,redis,mongodb

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist

      - name: Build assets (if applicable)
        run: npm install && npm run build # or yarn install && yarn build
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: "cd /var/www/saas-link2datai &&
                export NVM_DIR=/home/${{ secrets.USERNAME }}/.nvm &&
                source /home/${{ secrets.USERNAME }}/.nvm/nvm.sh &&
                git pull origin main &&
                composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader &&
                php artisan migrate --force &&
                php artisan cache:clear &&
                php artisan config:clear &&
                php artisan route:clear &&
                php artisan view:clear &&
                npm install &&
                npm run build"
